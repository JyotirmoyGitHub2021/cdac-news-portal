<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Windows C-DAC News Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f3; 
            margin: 40px;
        }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        
        /* ফর্মের ডিজাইন */
        .form-container {
            background: #fff; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .submit-btn {
            background-color: #2ecc71; color: white; border: none; padding: 10px 20px;
            font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%;
        }
        .submit-btn:hover { background-color: #27ae60; }

        /* নিউজ কার্ড ও ফ্লেক্স লেআউট (ডিলিট বোতাম ডানদিকে রাখার জন্য) */
        .news-card { 
            background: white; padding: 20px; margin: 15px 0; 
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .category-badge {
            background-color: #3498db; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;
        }
        
        /* ডিলিট বোতামের লাল ডিজাইন */
        .delete-btn {
            background-color: #e74c3c; color: white; border: none; padding: 8px 15px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .delete-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>নতুন খবর যুক্ত করুন</h2>
        <form id="newsForm">
            <div class="form-group">
                <label for="title">খবরের শিরোনাম (Title):</label>
                <input type="text" id="title" placeholder="এখানে শিরোনাম লিখুন..." required>
            </div>
            <div class="form-group">
                <label for="category">ক্যাটাগরি (Category):</label>
                <select id="category">
                    <option value="West Bengal Jobs">West Bengal Jobs</option>
                    <option value="IT Jobs">IT Jobs</option>
                    <option value="Central Govt Jobs">Central Govt Jobs</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">সাবমিট করুন</button>
        </form>
    </div>

    <h1>আজকের তাজা খবর</h1>
    <div id="news-container">খবর লোড হচ্ছে...</div>

    <script>
        const container = document.getElementById('news-container');

        // ১. সার্ভার থেকে সব খবর তুলে আনা (GET)
        function loadNews() {
            fetch('/news')
                .then(response => response.json())
                .then(result => {
                    container.innerHTML = '';
                    result.data.forEach(item => {
                        container.innerHTML += `
                            <div class="news-card">
                                <div>
                                    <h3>${item.title}</h3>
                                    <span class="category-badge">${item.category}</span>
                                </div>
                                <!-- ডিলিট বোতাম যুক্ত করা হলো, যা আইটেমের ID পাস করবে -->
                                <button class="delete-btn" onclick="deleteArticle(${item.id})">Delete</button>
                            </div>`;
                    });
                })
                .catch(err => container.innerHTML = "এরর: " + err.message);
        }

        loadNews();

        // ২. ফর্ম সাবমিট ও ডেটা পাঠানো (POST)
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const titleInput = document.getElementById('title').value;
            const categoryInput = document.getElementById('category').value;

            fetch('/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: titleInput, category: categoryInput })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    loadNews();
                    document.getElementById('title').value = '';
                }
            });
        });

        // ৩. নির্দিষ্ট খবর ডিলিট করার ফাংশন (DELETE)
        function deleteArticle(id) {
            if(confirm("আপনি কি সত্যিই এই খবরটি ডিলিট করতে চান?")) {
                fetch(`/news/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        loadNews(); // ডিলিট হওয়ার পর পেজ রিফ্রেশ না করেই লিস্ট আপডেট করা
                    }
                })
                .catch(err => alert("ডিলিট করা যায়নি: " + err.message));
            }
        }
    </script>
</body>
</html>
